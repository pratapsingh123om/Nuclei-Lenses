services:
  - type: web
    name: nuclei-lens-api
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /api/health
    envVars:
      - key: NUCLEI_MODEL_DIR
        value: /app/model
      - key: NUCLEI_CORS_ORIGINS
        sync: false
      - key: NUCLEI_INFERENCE_BATCH_SIZE
        value: "1"
      - key: NUCLEI_MAX_UPLOAD_MB
        value: "20"
      - key: NUCLEI_MAX_IMAGE_PIXELS
        value: "40000000"
    disk:
      name: nuclei-lens-model
      mountPath: /app/model
      sizeGB: 1

