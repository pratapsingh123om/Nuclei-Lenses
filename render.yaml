services:
  - type: web
    name: nuclei-lens-api
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /api/health
    envVars:
      - key: NUCLEI_MODEL_DIR
        value: /tmp/nuclei-model
      - key: NUCLEI_MODEL_BUNDLE_URL
        sync: false
      - key: NUCLEI_MODEL_BUNDLE_SHA256
        sync: false
      - key: NUCLEI_CORS_ORIGINS
        sync: false
      - key: NUCLEI_INFERENCE_BATCH_SIZE
        value: "1"
      - key: NUCLEI_MAX_UPLOAD_MB
        value: "20"
      - key: NUCLEI_MAX_IMAGE_PIXELS
        value: "40000000"
      - key: NUCLEI_MODEL_BUNDLE_MAX_MB
        value: "1024"

